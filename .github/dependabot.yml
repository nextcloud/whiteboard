version: 2
updates:
- package-ecosystem: npm
  directory: "/"
  target-branch: "main"
  schedule:
    interval: weekly
    day: saturday
    time: "03:00"
    timezone: Europe/Paris
  open-pull-requests-limit: 10
  ignore:
  # Fork builds are versioned 0.18.0-<commit>, which semver orders by hash, not by date
  - dependency-name: "@nextcloud/excalidraw"
  labels:
  - 3. to review
  - dependencies
  reviewers:
  - juliushaertl
  - hweihwang
  - grnd-alt

- package-ecosystem: composer
  directory: "/"
  schedule:
    interval: weekly
    day: saturday
    time: "03:00"
    timezone: Europe/Paris
  open-pull-requests-limit: 10
  labels:
  - 3. to review
  - dependencies
  reviewers:
  - juliushaertl
  - hweihwang
  - grnd-alt

- package-ecosystem: "docker"
  directory: "/"
  schedule:
    interval: "weekly"
    day: saturday
    time: "03:00"
    timezone: Europe/Paris
  open-pull-requests-limit: 10
  labels:
  - 3. to review
  - dependencies
  reviewers:
  - juliushaertl
  - hweihwang
  - grnd-alt
