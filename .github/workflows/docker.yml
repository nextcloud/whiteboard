name: Docker image

on:
  release:
    types: [published]
  pull_request:
    paths:
      - .dockerignore
      - .github/workflows/docker.yml
      - Dockerfile
      - package.json
      - package-lock.json
      - src/shared/**
      - websocket_server/**
  push:
    branches:
        - main
        - master
        - stable*

env:
  GHCR_REPO: ghcr.io/${{ github.repository_owner }}/whiteboard

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-22.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Set vars
        id: vars
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            if [[ "${{ github.event.release.prerelease }}" == "true" ]]; then
              echo "version_channel=beta" >> $GITHUB_OUTPUT
            else
              echo "version_channel=stable" >> $GITHUB_OUTPUT
            fi
          else
            echo "version_channel=daily" >> $GITHUB_OUTPUT
          fi
          echo "version=${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "version_ref=${{ github.event_name == 'release' && github.ref_name || github.sha }}" >> $GITHUB_OUTPUT
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT
          echo "platform=$(echo -n ${{ matrix.platform }} | sed 's/\//-/g')" >> $GITHUB_OUTPUT

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to Github Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build docker images
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          platforms: ${{ matrix.platform }}
          provenance: false
          build-args: |
            VERSION=${{ steps.vars.outputs.version_ref }}
            REVISION=${{ github.sha }}
            CREATED=${{ steps.vars.outputs.created }}
          tags: |
            ${{ env.GHCR_REPO}}:${{ steps.vars.outputs.version }}-${{ steps.vars.outputs.platform }}

      - name: Wait for the container to become healthy
        if: github.event_name == 'pull_request'
        env:
          IMAGE: ${{ env.GHCR_REPO}}:${{ steps.vars.outputs.version }}-${{ steps.vars.outputs.platform }}
        run: |
          docker run -d --name whiteboard -e JWT_SECRET_KEY=ci "$IMAGE"
          docker run -d --name whiteboard-port -e JWT_SECRET_KEY=ci -e PORT=4000 "$IMAGE"
          for container in whiteboard whiteboard-port; do
            for _ in $(seq 1 24); do
              status=$(docker inspect --format '{{.State.Health.Status}}' "$container")
              echo "$container health: $status"
              if [ "$status" = healthy ]; then
                continue 2
              fi
              sleep 5
            done
            docker logs "$container"
            exit 1
          done

      - name: Check that the image reaps orphaned processes and stops cleanly
        if: github.event_name == 'pull_request'
        run: |
          # An orphan is handed to PID 1, which must reap it once it exits
          docker exec whiteboard sh -c 'sleep 1 &'
          sleep 3
          docker exec whiteboard ps -o pid,ppid,stat,comm
          if docker exec whiteboard ps -o stat | grep -q Z; then
            echo 'Zombie processes left behind'
            exit 1
          fi
          docker stop --time 20 whiteboard
          code=$(docker inspect --format '{{.State.ExitCode}}' whiteboard)
          docker logs --tail 20 whiteboard
          [ "$code" = 0 ]

  release:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    needs: build

    steps:
      - name: Set vars
        id: vars
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            if [[ "${{ github.event.release.prerelease }}" == "true" ]]; then
              echo "version_channel=beta" >> $GITHUB_OUTPUT
            else
              echo "version_channel=stable" >> $GITHUB_OUTPUT
            fi
          else
            echo "version_channel=daily" >> $GITHUB_OUTPUT
          fi
          echo "version_ref=${{ github.event_name == 'release' && github.ref_name || github.sha }}" >> $GITHUB_OUTPUT
          echo "version=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Login to Github Container Registry
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GHCR manifest
        run: |
          # Create manifest for the specific version (tag name or commit SHA)
          docker manifest create $GHCR_REPO:${{ steps.vars.outputs.version_ref }} \
            $GHCR_REPO:${{ steps.vars.outputs.version }}-linux-amd64 \
            $GHCR_REPO:${{ steps.vars.outputs.version }}-linux-arm64

          # Create manifest for the channel (release, prerelease, or daily)
          docker manifest create $GHCR_REPO:${{ steps.vars.outputs.version_channel }} \
            $GHCR_REPO:${{ steps.vars.outputs.version }}-linux-amd64 \
            $GHCR_REPO:${{ steps.vars.outputs.version }}-linux-arm64

          # Create 'latest' tag only for stable releases (not pre-releases)
          if [[ "${{ steps.vars.outputs.version_channel }}" == "stable" ]]; then
            docker manifest create $GHCR_REPO:latest \
              $GHCR_REPO:${{ steps.vars.outputs.version }}-linux-amd64 \
              $GHCR_REPO:${{ steps.vars.outputs.version }}-linux-arm64
          fi

      - name: Push manifests
        run: |
          docker manifest push $GHCR_REPO:${{ steps.vars.outputs.version_ref }}
          docker manifest push $GHCR_REPO:${{ steps.vars.outputs.version_channel }}

          # Push 'latest' tag only for stable releases
          if [[ "${{ steps.vars.outputs.version_channel }}" == "stable" ]]; then
            docker manifest push $GHCR_REPO:latest
          fi
